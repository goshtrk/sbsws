<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>ENTRY — SEIBU BREAK SPREAD WS</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080808; --panel:#111; --line:rgba(255,255,255,.22);
  --muted:rgba(255,255,255,.58); --white:#f5f5f5;
  --acid:#ccff00; --cyan:#00f0ff;
}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);scroll-behavior:smooth;overflow-x:clip}
body{
  margin:0; width:100%; min-width:320px; overflow-x:clip; background:var(--bg); color:var(--white);
  font-family:Inter,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.page{width:min(100%,900px);margin:0 auto;padding:clamp(24px,6vw,64px) clamp(20px,6vw,64px) 44px}
.topline{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line);
  color:var(--muted);font:10px/1.5 "SFMono-Regular",Consolas,monospace;
  letter-spacing:.13em;text-transform:uppercase
}
.topline .mark{color:var(--acid)}
.back{
  display:inline-flex;align-items:center;gap:9px;margin:22px 0 34px;
  color:rgba(255,255,255,.72);text-decoration:none;
  font:10px/1.4 "SFMono-Regular",Consolas,monospace;letter-spacing:.08em
}
.back::before{content:"";width:8px;height:8px;border-left:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg)}
.heading{display:block;padding-bottom:22px;border-bottom:1px solid var(--line)}
.kicker{padding-top:8px;color:var(--acid);font:10px/1.5 "SFMono-Regular",Consolas,monospace;letter-spacing:.14em}
h1{margin:0;font-size:clamp(42px,8vw,76px);line-height:.88;letter-spacing:-.065em;font-weight:900;overflow-wrap:anywhere}
h1 span{color:var(--acid)}
.lead{max-width:620px;margin:25px 0 0 154px;color:rgba(255,255,255,.68);font-size:13px;line-height:1.9}
.workshop-id{
  display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
  margin:22px 0 30px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.workshop-name{font-size:14px;font-weight:800;letter-spacing:.015em}
.workshop-instructor{color:var(--muted);font-size:12px}
.workshop-instructor b{color:var(--white);font-weight:600}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:17px}
.section-head h2{margin:0;font-size:22px;letter-spacing:-.04em}
.section-head span{color:var(--muted);font:9px/1.5 "SFMono-Regular",Consolas,monospace;letter-spacing:.1em}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px}
.field{display:flex;flex-direction:column;gap:9px;min-width:0}
.field.full{grid-column:1/-1}
.field.half{grid-column:auto}
label,.field-label{font:10px/1.5 "SFMono-Regular",Consolas,monospace;letter-spacing:.1em;color:rgba(255,255,255,.8)}
.req{margin-left:6px;color:var(--acid);font-size:9px}
.optional{margin-left:6px;color:var(--muted);font-size:9px}
input,select,textarea{
  display:block;max-width:100%;width:100%;min-width:0;min-height:52px;border:1px solid rgba(255,255,255,.34);
  border-radius:0;background:#101010;color:#fff;padding:13px 14px;
  font:14px/1.5 Arial,"Noto Sans JP",sans-serif;appearance:none;
}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.32)}
select{
  background-image:linear-gradient(45deg,transparent 50%,#ccc 50%),linear-gradient(135deg,#ccc 50%,transparent 50%);
  background-position:calc(100% - 18px) 22px,calc(100% - 13px) 22px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px
}
textarea{min-height:116px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:2px}
.hint{margin:0;color:var(--muted);font-size:10px;line-height:1.7}
.consent{
  grid-column:1/-1;display:flex;align-items:flex-start;gap:11px;
  padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  color:rgba(255,255,255,.72);font-size:11px;line-height:1.8
}
.consent input{appearance:auto;width:18px;height:18px;min-height:0;flex:none;margin:2px 0 0;accent-color:var(--acid)}
.consent a{color:var(--acid);text-underline-offset:3px}
.actions{grid-column:1/-1;display:flex;flex-direction:column;gap:13px;align-items:flex-start}
.submit{
  width:100%;min-height:58px;padding:0 17px;border:1px solid #000;background:var(--acid);color:#050505;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  box-shadow:4px 4px 0 #000;cursor:pointer;
  font:800 14px/1.2 Arial,sans-serif;letter-spacing:.04em
}
.submit .arrow{font-size:23px;line-height:1}
.submit:active{transform:translateY(1px)}
.submit:focus-visible{outline:2px solid #fff;outline-offset:4px}
.disclaimer{margin:0;color:var(--muted);font-size:10px;line-height:1.8}
.footer{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:38px;padding-top:16px;border-top:1px solid var(--line);
  color:rgba(255,255,255,.42);font:9px/1.6 "SFMono-Regular",Consolas,monospace;letter-spacing:.08em
}
.footer a{text-decoration:none}
.success{display:none;margin-top:22px;padding:18px;border:1px solid var(--acid);color:var(--acid);font-size:13px;line-height:1.8}
@media(max-width:600px){
  .page{width:100%;padding:16px 18px 26px}
  .topline{font-size:9px}
  .back{margin:18px 0 28px}
  .heading{grid-template-columns:1fr;gap:9px;padding-bottom:17px}
  .kicker{padding:0;font-size:9px}
  h1{font-size:clamp(42px,13vw,64px)}
  .workshop-id{margin:19px 0 27px;align-items:flex-start;flex-direction:column;gap:5px}
  .workshop-name{font-size:12px}
  .workshop-instructor{font-size:10px}
  .section-head{margin-bottom:14px}
  .section-head h2{font-size:18px}
  .section-head span{font-size:8px}
  .form{grid-template-columns:1fr;gap:15px}
  .field.full,.field.half,.consent,.actions{grid-column:1}
  input,select{min-height:48px;padding:11px 12px}
  textarea{min-height:86px;padding:11px 12px}
  .consent{padding:13px 0;font-size:10px}
  .submit{min-height:52px}
  .footer{margin-top:32px;font-size:8px}
}
@media(max-width:360px){
  .page{padding-left:14px;padding-right:14px}
  h1{font-size:40px}
  .section-head{align-items:flex-start;flex-direction:column;gap:4px}
}
@media(max-height:520px) and (orientation:landscape){
  .page{padding-top:12px;padding-bottom:18px}
  .back{margin:12px 0 18px}
  .heading{display:block;padding-bottom:13px}
  h1{font-size:clamp(34px,7vw,52px)}
  .workshop-id{margin:14px 0 18px;padding:9px 0}
  .section-head{margin-bottom:10px}
  .form{gap:12px}
  input,select{min-height:42px}
  textarea{min-height:64px}
  .consent{padding:9px 0}
  .footer{margin-top:22px}
}
@media(min-width:601px){
  .submit{max-width:420px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="page">

  <a class="back" href="index.html">BACK TO WORKSHOP</a>

  <header>
    <div class="heading">

      <h1>WORKSHOP<br><span>ENTRY.</span></h1>
    </div>
  </header>

  <div class="workshop-id" aria-label="Workshop and instructor">
    <span class="workshop-name">SEIBU BREAK SPREAD WS</span>
    <span class="workshop-instructor">INSTRUCTOR / <b>NOMU (Staill Diggin')</b></span>
  </div>

  <section aria-labelledby="form-title">
    <div class="section-head"><h2 id="form-title">参加申し込み</h2><span>ALL FIELDS WITH * REQUIRED</span></div>
    <form class="form" id="entryForm">
      <div class="field half">
        <label for="name">NAME <b class="req">*</b></label>
        <input id="name" name="name" type="text" placeholder="例）山田 太郎" autocomplete="name" required>
      </div>
      <div class="field half">
        <label for="email">EMAIL ADDRESS <b class="req">*</b></label>
        <input id="email" name="email" type="email" placeholder="example@email.com" autocomplete="email" required>
        <p class="hint">受付に関するご連絡をお送りします。入力間違いにご注意ください。</p>
      </div>
      <div class="field full">
        <label for="message">MESSAGE <span class="optional">OPTIONAL</span></label>
        <textarea id="message" name="message" placeholder="質問・連絡事項などがあればご記入ください。"></textarea>
      </div>
      <label class="consent">
        <input type="checkbox" id="agree" required>
        <span>入力内容に間違いがないことを確認しました。<b class="req">*</b><br>※このページはデザイン確認用のモックアップです。入力情報は送信・保存されません。</span>
      </label>
      <div class="actions">
        <button class="submit" type="submit"><span>CONFIRM ENTRY</span><span class="arrow" aria-hidden="true">→</span></button>
        <p class="disclaimer">送信ボタンの動作はデモです。実際の申し込み受付には接続されていません。</p>
      </div>
    </form>
    <div class="success" id="success" role="status">入力内容の確認が完了しました。<br>※モックアップのため、申し込みは送信されていません。</div>
  </section>

  <footer class="footer"><span>© 2026 SEIBU BREAK SPREAD</span><a href="https://www.instagram.com/seibu_breakspread/" target="_blank" rel="noopener noreferrer">INSTAGRAM ↗</a></footer>
</main>
<script>
document.getElementById('entryForm').addEventListener('submit', function(event){
  event.preventDefault();
  if(!this.reportValidity()) return;
  document.getElementById('success').style.display='block';
  document.getElementById('success').scrollIntoView({behavior:'smooth',block:'nearest'});
});
</script>
</body>
</html>
