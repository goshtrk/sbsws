<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>ENTRY LIST — SEIBU BREAK SPREAD WS</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:rgba(255,255,255,.22);--muted:rgba(255,255,255,.58);--white:#f5f5f5;--acid:#ccff00}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);overflow-x:clip}
body{margin:0;min-width:320px;overflow-x:clip;background:var(--bg);color:var(--white);font-family:Inter,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
.page{width:min(100%,900px);margin:0 auto;padding:clamp(20px,5vw,54px) clamp(18px,5vw,54px) 38px}
.back{display:inline-flex;align-items:center;gap:9px;margin:0 0 30px;color:rgba(255,255,255,.72);text-decoration:none;font:10px/1.4 "SFMono-Regular",Consolas,monospace;letter-spacing:.08em}
.back:before{content:"";width:8px;height:8px;border-left:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg)}
.eventbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.eventname{font-size:14px;font-weight:850;letter-spacing:.015em}
.eventmeta{color:var(--muted);font:10px/1.6 "SFMono-Regular",Consolas,monospace;letter-spacing:.06em}
.summary{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:30px 0 20px}
.summary-label{margin:0 0 7px;color:var(--acid);font:10px/1.5 "SFMono-Regular",Consolas,monospace;letter-spacing:.14em}
.summary h1{margin:0;font-size:clamp(32px,6vw,52px);line-height:.95;letter-spacing:-.06em;font-weight:900}
.summary h1 span{color:var(--acid)}
.count{text-align:right;flex:none}
.count-number{font-size:clamp(30px,5vw,43px);font-weight:900;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.count-number small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.count-caption{margin-top:7px;color:var(--muted);font:9px/1.5 "SFMono-Regular",Consolas,monospace;letter-spacing:.1em}
.capacity{margin:0 0 26px}
.capacity-track{height:5px;background:#292929;overflow:hidden}
.capacity-fill{height:100%;width:0;background:var(--acid);transition:width .25s}
.capacity-note{display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--muted);font:9px/1.5 "SFMono-Regular",Consolas,monospace;letter-spacing:.06em}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}
.section-head h2{margin:0;font-size:19px;letter-spacing:-.04em}
.section-head span{color:var(--muted);font:9px/1.5 "SFMono-Regular",Consolas,monospace;letter-spacing:.1em}
.list{border-top:1px solid var(--line)}
.person{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:66px;padding:13px 12px;border-bottom:1px solid var(--line)}
.person-no{color:var(--acid);font:11px/1.4 "SFMono-Regular",Consolas,monospace;letter-spacing:.08em}
.person-name{font-size:14px;font-weight:700;letter-spacing:.01em}
.person-tag{color:var(--muted);font:9px/1.4 "SFMono-Regular",Consolas,monospace;letter-spacing:.06em}
.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8;border-bottom:1px solid var(--line)}
.closed-note{display:none;margin-top:18px;padding:14px 15px;border:1px solid var(--acid);color:var(--acid);font-size:12px;line-height:1.7}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:36px;padding-top:15px;border-top:1px solid var(--line);color:rgba(255,255,255,.42);font:9px/1.6 "SFMono-Regular",Consolas,monospace;letter-spacing:.08em}
.footer a{text-decoration:none}
@media(max-width:600px){
 .page{padding:17px 18px 28px}.back{margin-bottom:24px}
 .eventbar{align-items:flex-start;flex-direction:column;gap:5px}
 .eventname{font-size:12px}.eventmeta{font-size:9px}
 .summary{align-items:flex-end;margin:25px 0 18px;gap:8px}
 .summary h1{font-size:clamp(31px,9vw,44px)}
 .count-number{font-size:34px}.count-number small{font-size:11px}
 .person{grid-template-columns:39px minmax(0,1fr) auto;gap:10px;min-height:60px;padding:12px 8px}
 .person-name{font-size:13px}.person-tag{font-size:8px}
 .footer{margin-top:28px;font-size:8px}
}
</style>
</head>
<body>
<main class="page">
  <a class="back" href="index.html">BACK TO WORKSHOP</a>

  <div class="eventbar">
    <span class="eventname">SEIBU BREAK SPREAD WS</span>
    <span class="eventmeta">2026.12.13 SUN / INSTRUCTOR — NOMU (Staill Diggin')</span>
  </div>

  <section class="summary" aria-label="エントリー状況">
    <div><p class="summary-label">WORKSHOP / PARTICIPANTS</p><h1>ENTRY <span>LIST.</span></h1></div>
    <div class="count"><div class="count-number"><span id="entryCount">08</span><small> / <span id="capacityCount">20</span></small></div><div class="count-caption">ENTRIES / CAPACITY</div></div>
  </section>

  <div class="capacity">
    <div class="capacity-track"><div class="capacity-fill" id="capacityFill"></div></div>
    <div class="capacity-note"><span id="capacityStatus">ENTRY OPEN</span><span id="capacityRemaining">あと12名</span></div>
  </div>

  <section aria-labelledby="listTitle">
    <div class="section-head"><h2 id="listTitle">参加者一覧</h2><span>PARTICIPANTS</span></div>
    <div class="list" id="entryList"></div>
    <div class="closed-note" id="closedNote">定員に達しました。現在、参加申し込みの受付を終了しています。</div>
  </section>

  <footer class="footer"><span>© 2026 SEIBU BREAK SPREAD</span><a href="https://www.instagram.com/seibu_breakspread/" target="_blank" rel="noopener noreferrer">INSTAGRAM ↗</a></footer>
</main>

<script>
// 公開画面の表示設定：運営時はここを変更する想定です。
const DISPLAY_SETTINGS = {
  capacity: 20,                 // 定員
  overflowMode: "hide"          // "hide" = 定員まで表示 / "show" = 定員超過分も表示
};

// デモ用サンプルデータ。実運用ではGAS等から取得したデータに差し替えます。
// 公開画面では氏名のみを表示し、メールアドレス・メッセージ等は扱いません。
const entries = [
  {id:1,name:"山田 太郎",received:"2026-11-02T10:42:00"},
  {id:2,name:"佐藤 花",received:"2026-11-02T09:18:00"},
  {id:3,name:"鈴木 蓮",received:"2026-11-01T21:36:00"},
  {id:4,name:"高橋 美咲",received:"2026-11-01T18:05:00"},
  {id:5,name:"田中 海斗",received:"2026-10-31T14:22:00"},
  {id:6,name:"伊藤 葵",received:"2026-10-30T20:11:00"},
  {id:7,name:"渡辺 悠",received:"2026-10-29T16:48:00"},
  {id:8,name:"小林 凛",received:"2026-10-28T11:03:00"}
];

const capacity = Math.max(0, Number(DISPLAY_SETTINGS.capacity) || 0);
const total = entries.length;
const visibleEntries = DISPLAY_SETTINGS.overflowMode === "show" ? entries : entries.slice(0, capacity);
const shown = visibleEntries.slice().sort((a,b) => new Date(a.received)-new Date(b.received));
const count = document.getElementById("entryCount");
const fill = document.getElementById("capacityFill");
const list = document.getElementById("entryList");
const closedNote = document.getElementById("closedNote");

count.textContent = String(total).padStart(2,"0");
document.getElementById("capacityCount").textContent = String(capacity).padStart(2,"0");
fill.style.width = (capacity ? Math.min(total/capacity*100,100) : 0) + "%";

if(total >= capacity && capacity > 0){
  document.getElementById("capacityStatus").textContent = "CAPACITY REACHED";
  document.getElementById("capacityRemaining").textContent = "受付終了";
  closedNote.style.display = "block";
}else{
  document.getElementById("capacityStatus").textContent = "ENTRY OPEN";
  document.getElementById("capacityRemaining").textContent = `あと${Math.max(capacity-total,0)}名`;
}

if(shown.length === 0){
  list.innerHTML = '<div class="empty">現在、エントリーはありません。</div>';
}else{
  list.innerHTML = shown.map((entry,index)=>`
    <div class="person">
      <span class="person-no">${String(index+1).padStart(2,"0")}</span>
      <span class="person-name">${escapeHTML(entry.name)}</span>
      <span class="person-tag">ENTRY</span>
    </div>`).join("");
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
